# Production stack for nucklehead (also the file CI deploys with `docker compose up --build -d`).
# Real secrets come from an untracked, gitignored .env in this dir (auto-loaded by compose
# for ${VAR} substitution). No Postgres: Ballotfix keeps everything in one SQLite file,
# BALLOTFIX_DATA_DIR/ballotfix.db (src/web/db.ts), so a named volume is enough.
services:
  web:
    build: .
    container_name: ballotfix-web
    restart: unless-stopped
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # 0.0.0.0: the app's own default (127.0.0.1, SECURITY.md) is unreachable from
      # outside the container's network namespace. Docker only forwards the published
      # port below, and nucklehead's Caddy (Tailscale/localhost-scoped) is the actual
      # boundary — same posture as parallax-fix and tower-expert.
      HOST: 0.0.0.0
      # Fixed: the published mapping below targets 8787, so a PORT override in .env
      # would silently break it. Change the host side of the mapping instead.
      PORT: 8787
      # Caddy uses `handle /ballotfix*` (preserves the prefix) to match, not
      # `handle_path` — see src/web/server.ts's basePath handling.
      BASE_PATH: ${BASE_PATH:-/ballotfix}
      # Research spends money on the API key; require auth since HOST is 0.0.0.0 here.
      BALLOTFIX_PASSWORD: ${BALLOTFIX_PASSWORD:?set in .env}
      BALLOTFIX_DATA_DIR: /app/data
      BALLOTFIX_MODEL: ${BALLOTFIX_MODEL:-}
      BALLOTFIX_EFFORT: ${BALLOTFIX_EFFORT:-high}
    ports:
      # 127.0.0.1 binding: only the host Caddy may reach this; Tailscale is the boundary.
      - "127.0.0.1:8421:8787"
    volumes:
      - ballotfix_data:/app/data
    # /healthz is public (before the password check). CI deploys with `up --wait`,
    # so a crash-looping container fails the deploy instead of passing silently.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8787/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

volumes:
  ballotfix_data:
