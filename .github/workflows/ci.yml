name: CI

on:
  push:
    branches: [main]
  pull_request:

# Serialize runs per ref so two pushes can't deploy into the same dir concurrently.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: fmt · lint · check · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Format
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno check src/main.ts src/serve.ts examples/demo_server.ts examples/build_sample.ts

      # No network or API key needed: the research adapter is tested against a stubbed client.
      - name: Test
        run: deno task test

  # nucklehead is the only deploy target (private, Tailscale-only — see CLAUDE.md).
  # No prod Droplet exists for Ballotfix, so unlike parallax-fix there's no
  # development/main split: this repo deploys straight from main.
  deploy:
    name: Deploy to nucklehead
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: self-hosted
    steps:
      - name: Pull latest and restart containers
        run: |
          cd /srv/data-collection/ballotfix
          git fetch origin
          # Stash any local work (recoverable via `git stash list`) so reset --hard
          # can't silently destroy it; -u keeps the gitignored .env untouched. No
          # `|| true`: if the stash fails, abort rather than reset over unsaved work.
          git stash push -u -m "pre-deploy $(date -Iseconds)"
          git checkout -B main origin/main
          # --wait blocks until the healthcheck passes and fails the job if it doesn't.
          docker compose up --build -d --wait --wait-timeout 120
